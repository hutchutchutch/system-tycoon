<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B1426; font-family: 'Inter', sans-serif; }
    .scene { width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 80px; }
    .diagram { display: flex; align-items: center; gap: 8px; }
    .node { width: 220px; height: 130px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(15,23,42,0.95); opacity: 0; transform: scale(0); }
    .node-icon { font-size: 40px; }
    .node-label { font-size: 18px; font-weight: 600; color: #FFF; }
    .node-sub { font-size: 13px; color: #94A3B8; }
    .n-people { border: 2px solid #EAB308; }
    .n-system { border: 2px solid #3B82F6; }
    .n-impact { border: 2px solid #22C55E; }
    .edge-wrap { width: 100px; height: 4px; overflow: hidden; border-radius: 2px; background: #1E293B; }
    .edge-fill { height: 100%; width: 0; }
    .ef1 { background: linear-gradient(90deg, #EAB308, #3B82F6); }
    .ef2 { background: linear-gradient(90deg, #3B82F6, #22C55E); }
    .thesis { opacity: 0; text-align: center; }
    .thesis-text { font-size: 38px; font-weight: 600; color: #FFFFFF; letter-spacing: -0.02em; }
  </style>
</head>
<body>
<div data-composition-id="03-architect" data-width="1920" data-height="1080" style="width:1920px;height:1080px;position:relative;overflow:hidden;">
  <div class="scene">
    <div class="diagram">
      <div class="node n-people" id="n1"><span class="node-icon">👤</span><span class="node-label">People</span><span class="node-sub">doing good</span></div>
      <div class="edge-wrap"><div class="edge-fill ef1" id="e1"></div></div>
      <div class="node n-system" id="n2"><span class="node-icon">🖥</span><span class="node-label">System</span><span class="node-sub">that scales</span></div>
      <div class="edge-wrap"><div class="edge-fill ef2" id="e2"></div></div>
      <div class="node n-impact" id="n3"><span class="node-icon">🌍</span><span class="node-label">Impact</span><span class="node-sub">at scale</span></div>
    </div>
    <div class="thesis" id="thesis"><div class="thesis-text">System design is the skill that scales the good.</div></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to('#n1', { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, 0.5);
tl.to('#e1', { width: '100%', duration: 0.7, ease: 'power2.inOut' }, 0.9);
tl.to('#n2', { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, 1.2);
tl.to('#e2', { width: '100%', duration: 0.7, ease: 'power2.inOut' }, 1.6);
tl.to('#n3', { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, 1.9);
// Pulse
tl.to('#n1', { boxShadow: '0 0 24px rgba(234,179,8,0.5)', duration: 0.3, yoyo: true, repeat: 1 }, 2.8);
tl.to('#n2', { boxShadow: '0 0 24px rgba(59,130,246,0.5)', duration: 0.3, yoyo: true, repeat: 1 }, 3.0);
tl.to('#n3', { boxShadow: '0 0 24px rgba(34,197,94,0.5)', duration: 0.3, yoyo: true, repeat: 1 }, 3.2);
// Thesis
tl.to('#thesis', { opacity: 1, duration: 0.6 }, 3.8);
tl.to({}, { duration: 6 });
window.__timelines["03-architect"] = tl;
</script>
</body>
</html>
