<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B1426; font-family: 'Inter', sans-serif; }
    .scene { width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
    .line1 { font-size: 28px; font-weight: 500; color: #CBD5E1; opacity: 0; }
    .line2 { font-size: 48px; font-weight: 700; color: #FFFFFF; opacity: 0; letter-spacing: -0.02em; }
    .url { font-size: 24px; font-weight: 400; color: #3B82F6; opacity: 0; position: relative; display: inline-block; margin-top: 16px; }
    .url-underline { position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #3B82F6; }
  </style>
</head>
<body>
<div data-composition-id="06-cta" data-width="1920" data-height="1080" style="width:1920px;height:1080px;position:relative;overflow:hidden;">
  <div class="scene">
    <div class="line1" id="l1">Learn system design.</div>
    <div class="line2" id="l2">Scale the good.</div>
    <div class="url" id="url">saas.game<div class="url-underline" id="underline"></div></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

tl.to('#l1', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.5);
tl.to('#l2', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 1.2);
tl.to('#url', { opacity: 1, duration: 0.4 }, 2.0);
tl.to('#underline', { width: '100%', duration: 0.4, ease: 'power2.out' }, 2.4);

tl.to({}, { duration: 4 });
window.__timelines["06-cta"] = tl;
</script>
</body>
</html>
