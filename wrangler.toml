name = "system-tycoon"
main = "worker/src/index.ts"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

# Serve the React SPA directly from the Worker.
# /api/* → Worker code, everything else → dist/ (with SPA fallback to index.html)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Apply Worker security headers to HTML/assets and keep API navigations out of
# the SPA fallback. All requests intentionally pass through the entry point.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "system-tycoon-db"
database_id = "17ad934c-9980-43b2-8858-984c222431ed"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "dc21cd5257c94225905be9612b25bc36"

# Preserve the already-applied DO migration history. No namespace is deleted.
[[migrations]]
tag = "v1"
new_classes = ["DesignSessionDO"]

# Top-level = production defaults (used by `wrangler deploy`).
# Local dev overrides these via .dev.vars.
[vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://saas.game"
EMAIL_FROM = "hutch@yakyak.solutions"
EMAIL_FROM_NAME = "Service as a Software"

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

# Secrets (via `wrangler secret put` or .dev.vars):
#   JWT_SECRET           — Better Auth session signing secret
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   RESEND_API_KEY       — transactional email (verification, reset, alerts)
#   OPENAI_API_KEY       — NPC chat responses

# Names only: keep generated types identical in CI and local development.
[secrets]
required = ["JWT_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "RESEND_API_KEY", "OPENAI_API_KEY"]
