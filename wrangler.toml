name = "system-tycoon"
main = "worker/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Serve the React SPA directly from the Worker.
# /api/* → Worker code, everything else → dist/ (with SPA fallback to index.html)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "system-tycoon-db"
database_id = "17ad934c-9980-43b2-8858-984c222431ed"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "dc21cd5257c94225905be9612b25bc36"

[[durable_objects.bindings]]
name = "DESIGN_SESSION"
class_name = "DesignSessionDO"

[[migrations]]
tag = "v1"
new_classes = ["DesignSessionDO"]

[vars]
ENVIRONMENT = "development"
BETTER_AUTH_URL = "http://localhost:8787"
EMAIL_FROM = "hello@saas.game"
EMAIL_FROM_NAME = "Service as a Software"

# Secrets (via `wrangler secret put` or .dev.vars):
#   JWT_SECRET           — Better Auth session signing secret
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   SENDGRID_API_KEY

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://saas.game"
EMAIL_FROM = "hello@saas.game"
EMAIL_FROM_NAME = "Service as a Software"
