name = "system-tycoon-api"
main = "worker/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "system-tycoon-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "DESIGN_SESSION"
class_name = "DesignSessionDO"

[[migrations]]
tag = "v1"
new_classes = ["DesignSessionDO"]

[vars]
ENVIRONMENT = "development"
BETTER_AUTH_URL = "http://localhost:8787"
EMAIL_FROM = "hello@saas.game"
EMAIL_FROM_NAME = "Service as a Software"

# Secrets (via `wrangler secret put` or .dev.vars):
#   JWT_SECRET           — Better Auth session signing secret
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   SENDGRID_API_KEY

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://saas.game"
EMAIL_FROM = "hello@saas.game"
EMAIL_FROM_NAME = "Service as a Software"
